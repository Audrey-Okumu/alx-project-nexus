[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate && gunicorn movie_backend.wsgi:application --bind 0.0.0.0:$PORT"

[variables]
PORT = "8080"

[services]
[[services.postgres]]
[[services.redis]]